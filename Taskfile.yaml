# MLX build automation (go-task: brew install go-task).
# macOS arm64 only — MLX targets Apple Silicon / Metal and does not
# cross-compile. Produces the release-named binary the TLC plugin imports:
#   build/tlc-mlx-runner-macos-arm64
# MLX is statically linked and Metal is a system framework: the binary is
# self-contained, no runtime downloads.

version: '3'

vars:
  BUILD_DIR: 'build'

tasks:
  default:
    desc: Build the runner and run the no-args smoke test
    cmds:
      - task: build
      - task: smoke

  build:
    desc: Release build → build/tlc-mlx-runner-macos-arm64
    cmds:
      - |
        TAG=$(git describe --tags --exact-match --dirty 2>/dev/null || true)
        if [ -n "$TAG" ]; then
          VERSION="$TAG"
        else
          DESCRIBE=$(git describe --tags --long --always --dirty 2>/dev/null || true)
          BRANCH=$(git branch --show-current 2>/dev/null || true)
          [ -n "$BRANCH" ] || BRANCH=detached
          [ -n "$DESCRIBE" ] || DESCRIBE=unknown
          VERSION="${DESCRIBE}+${BRANCH}.$(date +%Y%m%d%H%M%S)"
        fi
        printf '/// Generated by tasks.yaml — app version from git.\nlet appVersion = "%s"\n' "$VERSION" \
          > Sources/tlc-mlx-runner/Version.swift
      - swift build -c release
      - mkdir -p '{{.BUILD_DIR}}'
      - cp '.build/release/tlc-mlx-runner' '{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64'
    sources:
      - Sources/**/*
      - Package.swift
    generates:
      - '{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64'

  smoke:
    desc: No-args smoke — the runner must emit one {"type":"error"} event (CI checks exit code 2 separately)
    deps: [build]
    cmds:
      - |
        out=$(./{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64 2>/dev/null || true)
        echo "$out" | grep -q '"type":"error"' \
          || { echo "no error event: $out"; exit 1; }
        echo "$out" | grep -q 'missing required --model' \
          || { echo "unexpected error message: $out"; exit 1; }
        echo "smoke ok"

  smoke:version:
    desc: --version smoke — one {"type":"version"} event, exit code 0, no model load
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64 --version | grep -q '"type":"version"'

  e2e:
    desc: E2E test suite (protocol tests without a model; full suite with MODEL_DIR set)
    deps: [build]
    cmds:
      - python3 scripts/e2e.py test${MODEL_DIR:+ --model "$MODEL_DIR"}

  e2e:download-model:
    desc: Download the default E2E test model (Qwen2.5-Coder-0.5B 4-bit) into .cache/models/
    cmds:
      - python3 scripts/e2e.py download-model

  e2e:bench:
    desc: E2E benchmark — model load time + inference speed for 4-bit/8-bit 0.5B/1.5B/3B (SIZES=a,b filters)
    deps: [build]
    cmds:
      - python3 scripts/e2e.py bench${SIZES:+ --sizes "$SIZES"}

  smoke:model:
    desc: NDJSON smoke against a real model (set MODEL_DIR to an mlx-community 4-bit model directory)
    deps: [build]
    cmds:
      - |
        printf '%s\n' '{"type":"generate","id":1,"prompt":"<|fim_prefix|>def add(a, b):\n    <|fim_suffix|>\n    return a + b<|fim_middle|>","maxTokens":16,"stop":["\n"]}' \
        | ./{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64 --model "${MODEL_DIR:?set MODEL_DIR to an mlx-community model directory}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf '{{.BUILD_DIR}}' .build

  ci:
    desc: Build the runner and run smoke tests (CI entry point)
    cmds:
      - task: build
      - task: smoke
      - task: smoke:version
