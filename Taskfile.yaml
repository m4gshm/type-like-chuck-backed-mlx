# MLX build automation (go-task: brew install go-task).
# macOS arm64 only — MLX targets Apple Silicon / Metal and does not
# cross-compile. Produces the release-named binary the TLC plugin imports:
#   build/tlc-mlx-runner-macos-arm64
# MLX is statically linked and Metal is a system framework: the binary is
# self-contained, no runtime downloads.

version: '3'

vars:
  BUILD_DIR: 'build'
  VERSION_FILE: 'Sources/tlc-mlx-runner/Version.swift'

tasks:
  default:
    desc: Build the runner and run the no-args smoke test
    cmds:
      - task: build
      - task: smoke

  build:
    desc: Release build → build/tlc-mlx-runner-macos-arm64
    run: once
    cmds:
      - |
        TAG=$(git describe --tags --exact-match --dirty 2>/dev/null || true)
        if [ -n "$TAG" ]; then
          VERSION="$TAG"
        else
          DESCRIBE=$(git describe --tags --long --always --dirty 2>/dev/null || true)
          BRANCH=$(git branch --show-current 2>/dev/null || true)
          [ -n "$BRANCH" ] || BRANCH=detached
          [ -n "$DESCRIBE" ] || DESCRIBE=unknown
          VERSION="${DESCRIBE}+${BRANCH}.$(date +%Y%m%d%H%M%S)"
        fi
        printf '/// Generated by tasks.yaml — app version from git.\nlet appVersion = "%s"\n' "$VERSION" \
          > '{{.VERSION_FILE}}'
      - swift build -c release
      - mkdir -p '{{.BUILD_DIR}}'
      - cp '.build/release/tlc-mlx-runner' '{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64'
      # SwiftPM resource bundles (MLX default metallib etc.) must sit next to
      # the binary: without them the runner fails to load Metal at model load.
      # -f: bundle files land read-only from SwiftPM, so a re-copy over an
      # existing build/ needs unlink-and-recreate.
      - cp -Rf '.build/release/'*.bundle '{{.BUILD_DIR}}/'
    sources:
      - Sources/**/*
      - Package.swift
    generates:
      - '{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64'

  smoke:
    desc: No-args smoke — the runner must emit one {"type":"error"} event (CI checks exit code 2 separately)
    deps: [build]
    cmds:
      - |
        out=$(./{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64 2>/dev/null || true)
        echo "$out" | grep -q '"type":"error"' \
          || { echo "no error event: $out"; exit 1; }
        echo "$out" | grep -q 'missing required --model' \
          || { echo "unexpected error message: $out"; exit 1; }
        echo "smoke ok"

  smoke:version:
    desc: --version smoke — one {"type":"version"} event, exit code 0, no model load
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64 --version | grep -q '"type":"version"'

  e2e:
    desc: E2E test suite (protocol tests without a model; full suite with MODEL_DIR set)
    deps: [build]
    cmds:
      - python3 scripts/e2e.py test${MODEL_DIR:+ --model "$MODEL_DIR"}

  e2e:download-model:
    desc: Download the default E2E test model (Qwen2.5-Coder-0.5B 4-bit) into .cache/models/
    cmds:
      - python3 scripts/e2e.py download-model

  e2e:bench:
    desc: E2E benchmark — model load time + inference speed for 4-bit/8-bit 0.5B/1.5B/3B/7B (SIZES=a,b filters)
    deps: [build]
    cmds:
      - python3 scripts/e2e.py bench${SIZES:+ --sizes "$SIZES"}

  e2e:bench:cache:
    desc: E2E benchmark with KV-cache reuse — adds warm continuations (ttft_w/cached_tok) per model (SIZES=a,b filters)
    deps: [build]
    cmds:
      - python3 scripts/e2e.py bench --cache${SIZES:+ --sizes "$SIZES"}

  smoke:model:
    desc: NDJSON smoke against a real model (set MODEL_DIR to an mlx-community 4-bit model directory)
    deps: [build]
    cmds:
      - |
        printf '%s\n' '{"type":"generate","id":1,"prompt":"<|fim_prefix|>def add(a, b):\n    <|fim_suffix|>\n    return a + b<|fim_middle|>","maxTokens":16,"stop":["\n"]}' \
        | ./{{.BUILD_DIR}}/tlc-mlx-runner-macos-arm64 --model "${MODEL_DIR:?set MODEL_DIR to an mlx-community model directory}"

  real:file:
    desc: Raw FIM against the bundled fixture (FILE, LINE, COLUMN override it) — observes the natural, possibly multi-line completion
    deps: [build]
    cmds:
      - python3 scripts/e2e.py real-file --file "${FILE:-scripts/fixtures/api_test.go}" --line "${LINE:-96}" --column "${COLUMN:-9}" --max-tokens "${MAX_TOKENS:-256}"${MODEL_DIR:+ --model "$MODEL_DIR"}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf '{{.BUILD_DIR}}' .build

  ci:
    desc: Build the runner and run smoke tests (CI entry point)
    cmds:
      - task: build
      - task: smoke
      - task: smoke:version

  release:upload:
    desc: Build from an exact pushed tag and attach the archive to the GitHub release (fails when HEAD is not the tag or sources differ from it)
    vars:
      RELEASE_TAG:
        sh: git describe --tags --exact-match 2>/dev/null || echo ''
      RELEASE_REPO:
        sh: git remote get-url origin | sed -E 's#.*github\.com[:/]##; s#\.git$##'
    cmds:
      - |
        [ -n '{{.RELEASE_TAG}}' ] \
          || { echo "release: HEAD is not exactly at a tag; cut one with git tag vX.Y.Z"; exit 1; }
        HEAD_SHA=$(git rev-parse HEAD)
        REMOTE=$(git ls-remote origin "refs/tags/{{.RELEASE_TAG}}")
        REMOTE_SHA=$(echo "$REMOTE" | grep -v '\^{}' | cut -f1 | head -1)
        PEELED_SHA=$(echo "$REMOTE" | grep '\^{}' | cut -f1 | head -1)
        [ "$REMOTE_SHA" = "$HEAD_SHA" ] || [ "$PEELED_SHA" = "$HEAD_SHA" ] \
          || { echo "release: origin tag {{.RELEASE_TAG}} does not point at HEAD ($HEAD_SHA); push the tag first"; exit 1; }
        git restore '{{.VERSION_FILE}}' 2>/dev/null || true
        git diff --quiet HEAD -- Sources Package.swift Package.resolved \
          || { echo "release: working tree differs from tag {{.RELEASE_TAG}} in Sources/manifests"; exit 1; }
        echo "release: {{.RELEASE_TAG}} -> {{.RELEASE_REPO}}"
      - task: build
      - |
        mkdir -p dist
        (cd '{{.BUILD_DIR}}' && tar -czf ../dist/tlc-mlx-runner-macos-arm64.tar.gz tlc-mlx-runner-macos-arm64 *.bundle)
        gh release view '{{.RELEASE_TAG}}' -R '{{.RELEASE_REPO}}' >/dev/null 2>&1 \
          || gh release create '{{.RELEASE_TAG}}' --draft --verify-tag --generate-notes -R '{{.RELEASE_REPO}}'
        gh release upload '{{.RELEASE_TAG}}' dist/tlc-mlx-runner-macos-arm64.tar.gz --clobber -R '{{.RELEASE_REPO}}'
        git restore '{{.VERSION_FILE}}' 2>/dev/null || true
        echo "uploaded tlc-mlx-runner-macos-arm64.tar.gz -> {{.RELEASE_TAG}}"
