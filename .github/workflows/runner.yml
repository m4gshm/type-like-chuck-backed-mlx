name: Runner

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build (macos-arm64)
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cache swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: swift-build-${{ runner.os }}-
      - name: cache test model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: e2e-model-${{ hashFiles('scripts/e2e.py') }}
      - name: build and smoke
        run: task ci
      # Full model suite (protocol + generation + FIM + queue/cancel) on the
      # same runner: merging it into build keeps the scarce macos-arm64
      # runners out of a second queue; the cached model keeps it to minutes.
      - name: fetch test model
        run: '[ -d .cache/models/qwen2.5-coder-0.5b-4bit ] || python3 scripts/e2e.py download-model'
      - name: e2e model suite
        run: MODEL_DIR=.cache/models/qwen2.5-coder-0.5b-4bit task e2e:prebuilt
      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tlc-mlx-runner-macos-arm64
          path: build/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A pushed tag publishes immediately: refuse when it is not on main,
      # so experimental branches cannot ship releases by accident.
      - name: verify the tag is on main
        run: |
          git init -q .
          git fetch -q origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} is not on main — release refused; tag the merge commit on main instead"
            exit 1
          }
      - name: download binaries
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist
      # One archive per release asset: the binary plus the colocated mlx.metallib
      # it loads from beside itself; directories cannot be release assets.
      - name: pack release asset
        run: |
          cd dist
          tar -czf tlc-mlx-runner-macos-arm64.tar.gz tlc-mlx-runner-macos-arm64 mlx.metallib
          rm -rf tlc-mlx-runner-macos-arm64 mlx.metallib
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
