name: Runner

on:
  workflow_dispatch:
  push:
    branches: [main, master, draft]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/runner.yml'
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: build (macos-arm64)
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: build
        run: swift build -c release
      - name: rename binary
        run: cp .build/release/tlc-mlx-runner tlc-mlx-runner-macos-arm64
      - name: loader smoke (no args must emit an error event and exit 2)
        run: |
          set +e
          out=$(./tlc-mlx-runner-macos-arm64 2>/dev/null)
          code=$?
          set -e
          test "$code" -eq 2 || { echo "runner exited with $code, expected 2"; exit 1; }
          echo "$out" | grep -q '"type":"error"' || { echo "runner did not emit the error event: $out"; exit 1; }
      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tlc-mlx-runner-macos-arm64
          path: tlc-mlx-runner-macos-arm64
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download binary
        uses: actions/download-artifact@v5
        with:
          name: tlc-mlx-runner-macos-arm64
          path: dist
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
